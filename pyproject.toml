[project]
name = "gemm-optimization"
version = "0.1.0"
description = "Stepwise GPU GEMM optimization project with Numba CUDA kernels and PyTorch benchmarking."
requires-python = ">=3.11"
dependencies = [
  "numba>=0.62",
  "numpy>=1.26",
  "torch>=2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
